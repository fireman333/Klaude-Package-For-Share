journal:
  name: NEJM
  short: nejm
  full_name: "New England Journal of Medicine"
  publisher: Massachusetts Medical Society
  spec_version: "2025.01"
  source_priority: [author_guideline, sample_papers, yuan1z0825]
  sources:
    author_guideline: https://www.nejm.org/author-center/manuscript-submission
    sample_dois:
      - "10.1056/NEJMoa2200674"
      - "10.1056/NEJMoa2403308"
    third_party_credit: "github.com/Yuan1z0825/nature-skills (MIT)"

typography:
  font_stack: [Arial, Helvetica, "Liberation Sans", DejaVu Sans]
  base_size_pt: 8
  sizes_pt:
    title: 9
    axis_label: 8
    tick: 7
    legend: 7
    panel_label: 9
  panel_label:
    style: bold
    case: upper
    format: "A"

dimensions:
  units: mm
  single_column: {width: 84,  max_height: 230}
  double_column: {width: 174, max_height: 230}
  full_width:    {width: 174, max_height: 230}
  dpi_raster: 300
  dpi_preview: 150

lines:
  axis_linewidth: 0.75
  data_linewidth: 1.2
  tick_length: 2.5
  tick_direction: out

palette:
  ref: palette.json

semantic_mapping:
  primary_method: nejm_blue
  positive_outcome: nejm_green
  control_or_negative: nejm_red
  neutral_reference: gray_2
  highlight: nejm_orange

submission:
  vector_format: EPS
  raster_format: TIFF
  preview_format: PNG
  svg_fonttype: none
  embed_fonts: true

caption:
  template: "Figure {n}. {title}. {body} {panel_descriptions}"
  title_case: title
  notes: "Captions tend to be longer than Nature/Lancet — describe both content and statistical method."
  panel_separator: ". "
  bold_title: false
  significance_legend_inline: false

ax_style:
  spines_visible: [bottom, left]
  grid: false
  legend_frame: false

table_style:
  decimal_places: {percent: 1, p_value: 3, hr: 2, ci: 2}
  p_value_format: "<0.001"
  bold_significant: false
  shading: alternating_rows
