journal:
  name: Nature
  short: nature
  publisher: Springer Nature
  spec_version: "2025.01"
  source_priority: [author_guideline, sample_papers, yuan1z0825]
  sources:
    author_guideline: https://www.nature.com/nature/for-authors/formatting-guide
    sample_dois:
      - "10.1038/s41586-023-06555-x"
      - "10.1038/s41586-024-07487-w"
    third_party_credit: "github.com/Yuan1z0825/nature-skills (MIT)"

typography:
  font_stack: [Helvetica, Arial, "Liberation Sans", DejaVu Sans]
  base_size_pt: 7
  sizes_pt:
    title: 8
    axis_label: 7
    tick: 6
    legend: 6
    panel_label: 8
  panel_label:
    style: bold
    case: lower
    format: "a"

dimensions:
  units: mm
  single_column: {width: 89,  max_height: 247}
  double_column: {width: 183, max_height: 247}
  full_width:    {width: 183, max_height: 247}
  dpi_raster: 300
  dpi_preview: 150

lines:
  axis_linewidth: 0.5
  data_linewidth: 1.0
  tick_length: 2.0
  tick_direction: out

palette:
  ref: palette.json

semantic_mapping:
  primary_method: blue_main
  positive_outcome: green_3
  control_or_negative: red_strong
  neutral_reference: gray_2
  highlight: orange_main

submission:
  vector_format: PDF
  raster_format: TIFF
  preview_format: PNG
  svg_fonttype: none
  embed_fonts: true

caption:
  template: "Fig. {n} | {bold_title}. {body}. {panel_descriptions}"
  panel_separator: ", "
  bold_title: true
  significance_legend_inline: true

ax_style:
  spines_visible: [bottom, left]
  grid: false
  legend_frame: false

table_style:
  decimal_places: {percent: 1, p_value: 3, hr: 2, ci: 2}
  p_value_format: "<0.001"
  bold_significant: false
  shading: alternating_rows
