<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>M3 canonical layout — Feed</title>
  <link rel="stylesheet" href="./tokens.css" />
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #fafafa; }
    .topbar { height: var(--topbar-h); background: #1d1b20; color: #fff; display: flex; align-items: center; padding-inline: var(--sp-4); }

    .feed-wrap { padding: var(--sp-4); }
    @media (min-width: 600px)  { .feed-wrap { padding: var(--sp-6); } }
    @media (min-width: 1200px) { .feed-wrap { padding: var(--sp-8); } }
    @media (min-width: 1600px) { .feed-wrap { max-width: var(--body-max); margin-inline: auto; } }

    /* Feed grid: auto-fills based on tile minimum width.
       Min widths are chosen so the column count naturally progresses 1 → 2 → 3-4 → 5-6
       as the viewport crosses M3 breakpoints at a conventional tile size. */
    .feed {
      display: grid;
      gap: var(--sp-4);
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    }
    @media (min-width: 600px)  { .feed { gap: var(--sp-6); } }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: var(--sp-4);
      box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 1px 3px rgba(0,0,0,.04);
      display: flex; flex-direction: column; gap: var(--sp-2);
      aspect-ratio: 4 / 3; /* consistent tile shape for scannability */
    }
    .card h3 { margin: 0; font-size: 16px; }
    .card p  { margin: 0; color: #444; }
  </style>
</head>
<body>
  <header class="topbar">Feed demo</header>

  <main class="feed-wrap">
    <div class="feed">
      <article class="card"><h3>Card 1</h3><p>Equivalent tile content.</p></article>
      <article class="card"><h3>Card 2</h3><p>Equivalent tile content.</p></article>
      <article class="card"><h3>Card 3</h3><p>Equivalent tile content.</p></article>
      <article class="card"><h3>Card 4</h3><p>Equivalent tile content.</p></article>
      <article class="card"><h3>Card 5</h3><p>Equivalent tile content.</p></article>
      <article class="card"><h3>Card 6</h3><p>Equivalent tile content.</p></article>
      <article class="card"><h3>Card 7</h3><p>Equivalent tile content.</p></article>
      <article class="card"><h3>Card 8</h3><p>Equivalent tile content.</p></article>
    </div>
  </main>
</body>
</html>
